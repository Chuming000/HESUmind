  <line x1="42" y1="56" x2="48" y2="56" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="52" y="41" width="130" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="117" y="61" text-anchor="middle" fill="#E6EDF3" font-size="13">D → 4D</text>
  <line x1="184" y1="56" x2="206" y2="56" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

