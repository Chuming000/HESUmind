  <line x1="436" y1="310" x2="456" y2="310" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="460" y="295" width="110" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="515" y="315" text-anchor="middle" fill="#E6EDF3" font-size="13">Σ pᵢEᵢ(x)</text>
  <line x1="572" y1="310" x2="586" y2="310" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="598" y="314" text-anchor="middle" fill="#AEB8C2" font-size="13">y</text>

  <text x="52" y="344" fill="#7D8590" font-size="11.5">E 个专家 · 每 token 只算 k 个 · 参数量 ≈ E×3DM</text>
</svg>
