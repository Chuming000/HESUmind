  <line x1="164" y1="310" x2="184" y2="310" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="188" y="295" width="110" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="243" y="315" text-anchor="middle" fill="#E6EDF3" font-size="13">top-k</text>
  <line x1="300" y1="310" x2="320" y2="310" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="324" y="295" width="110" height="30" rx="6" fill="#2F3237" stroke="#8B5CF6"/>
