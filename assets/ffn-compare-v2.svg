  <text x="52" y="90" fill="#7D8590" font-size="11.5">2 条投影 · 参数量 2DM · M = 4D</text>

  <line x1="16" y1="104" x2="604" y2="104" stroke="#30363D" stroke-dasharray="3 4"/>

  <!-- ================= Row 2: SwiGLU ================= -->
  <text x="20" y="134" fill="#8B5CF6" font-size="14" font-weight="600">SwiGLU FFN</text>

