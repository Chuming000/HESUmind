  <line x1="46" y1="205" x2="50" y2="205" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="54" y="146" width="130" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
