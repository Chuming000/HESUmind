  <line x1="542" y1="179" x2="560" y2="179" stroke="#9AA4AF" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="574" y="183" text-anchor="middle" fill="#AEB8C2" font-size="13">y</text>

  <text x="54" y="240" fill="#7D8590" font-size="11.5">3 条投影 · SiLU 只作用于 gate · M = 8/3 D</text>

  <line x1="16" y1="254" x2="604" y2="254" stroke="#30363D" stroke-dasharray="3 4"/>

