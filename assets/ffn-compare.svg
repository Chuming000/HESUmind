<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- ============ Panel A: ReLU FFN ============ -->
  <text x="150" y="26" text-anchor="middle" fill="#8B5CF6" font-size="14" font-weight="600">ReLU FFN</text>
  <text x="150" y="52" text-anchor="middle" fill="#B9C2CC" font-size="12">x  [B, T, D]</text>
  <line x1="150" y1="58" x2="150" y2="72" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="70" y="74" width="160" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="150" y="96" text-anchor="middle" fill="#E6EDF3" font-size="12">Linear  D → 4D</text>
  <line x1="150" y1="108" x2="150" y2="122" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="70" y="124" width="160" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="150" y="146" text-anchor="middle" fill="#E6EDF3" font-size="12">ReLU</text>
  <line x1="150" y1="158" x2="150" y2="172" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="70" y="174" width="160" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="150" y="196" text-anchor="middle" fill="#E6EDF3" font-size="12">Linear  4D → D</text>
  <line x1="150" y1="208" x2="150" y2="222" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="150" y="242" text-anchor="middle" fill="#B9C2CC" font-size="12">y</text>

  <text x="150" y="272" text-anchor="middle" fill="#7D8590" font-size="11">2 条投影 · 2DM</text>

  <!-- divider -->
  <line x1="300" y1="20" x2="300" y2="250" stroke="#30363D" stroke-dasharray="3 4"/>

  <!-- ============ Panel B: SwiGLU FFN ============ -->
  <text x="455" y="26" text-anchor="middle" fill="#8B5CF6" font-size="14" font-weight="600">SwiGLU FFN</text>
  <text x="455" y="52" text-anchor="middle" fill="#B9C2CC" font-size="12">x  [B, T, D]</text>

  <!-- split -->
  <line x1="455" y1="58" x2="455" y2="64" stroke="#8B949E" stroke-width="1.4"/>
  <line x1="385" y1="64" x2="525" y2="64" stroke="#8B949E" stroke-width="1.4"/>
  <line x1="376" y1="64" x2="376" y2="72" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="534" y1="64" x2="534" y2="72" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="308" y="74" width="136" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="376" y="96" text-anchor="middle" fill="#E6EDF3" font-size="11.5">gate  D → M</text>

  <rect x="466" y="74" width="136" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="534" y="96" text-anchor="middle" fill="#E6EDF3" font-size="11.5">up  D → M</text>

  <line x1="376" y1="108" x2="376" y2="122" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="308" y="124" width="136" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="376" y="146" text-anchor="middle" fill="#E6EDF3" font-size="11.5">SiLU（仅 gate）</text>

  <!-- multiply -->
  <line x1="376" y1="158" x2="440" y2="176" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="534" y1="108" x2="470" y2="176" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <circle cx="455" cy="186" r="13" fill="#2F3237" stroke="#8B5CF6"/>
  <text x="455" y="191" text-anchor="middle" fill="#E6EDF3" font-size="13">⊗</text>

  <line x1="455" y1="199" x2="455" y2="212" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="214" width="150" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="455" y="236" text-anchor="middle" fill="#E6EDF3" font-size="12">down  M → D</text>

  <text x="455" y="272" text-anchor="middle" fill="#7D8590" font-size="11">3 条投影 · 3DM · M = 8/3 D</text>

  <line x1="610" y1="20" x2="610" y2="250" stroke="#30363D" stroke-dasharray="3 4"/>

  <!-- ============ Panel C: MoE FFN ============ -->
  <text x="755" y="26" text-anchor="middle" fill="#8B5CF6" font-size="14" font-weight="600">MoE FFN</text>
  <text x="755" y="52" text-anchor="middle" fill="#B9C2CC" font-size="12">x  [B, T, D]</text>
  <line x1="755" y1="58" x2="755" y2="72" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="660" y="74" width="190" height="34" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="755" y="96" text-anchor="middle" fill="#E6EDF3" font-size="12">Router  D → E</text>
  <line x1="755" y1="108" x2="755" y2="122" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="660" y="124" width="190" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="755" y="144" text-anchor="middle" fill="#E6EDF3" font-size="11.5">softmax → top-k</text>
  <line x1="755" y1="154" x2="755" y2="168" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="650" y="170" width="210" height="34" rx="6" fill="#2F3237" stroke="#8B5CF6"/>
  <text x="755" y="192" text-anchor="middle" fill="#E6EDF3" font-size="11.5">Experts 1…E（各一个 SwiGLU）</text>
  <line x1="755" y1="204" x2="755" y2="218" stroke="#8B949E" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="660" y="220" width="190" height="30" rx="6" fill="#2F3237" stroke="#4A5058"/>
  <text x="755" y="240" text-anchor="middle" fill="#E6EDF3" font-size="12">Σ pᵢ · Eᵢ(x)</text>

  <text x="755" y="272" text-anchor="middle" fill="#7D8590" font-size="11">E 个专家 · 每 token 只算 k 个</text>

  <!-- caption -->
  <text x="450" y="306" text-anchor="middle" fill="#7D8590" font-size="11.5">D = 512 时：2,099,712 ／ 2,359,296 ／ 18,878,464（每 token 激活 4,722,688）</text>
</svg>
